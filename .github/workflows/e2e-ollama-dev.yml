name: Ollama Gateway E2E DEV

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ollama-gateway-e2e-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Gateway → Ollama real hermetic DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORRELATION_ID: ollama-gateway-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_FILE: artifacts/ollama-gateway-e2e-dev/evidence.json
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OLLAMA_IMAGE: ollama/ollama:0.34.3
      OLLAMA_MODEL: smollm2:135m

    steps:
      - name: Checkout immutable PR SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install isolated gateway dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Start pinned Ollama and pull compact model
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ollama-e2e -p 11434:11434 "$OLLAMA_IMAGE"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "OLLAMA_HEALTH_TIMEOUT" >&2
              exit 1
            fi
            sleep 1
          done
          docker exec ollama-e2e ollama pull "$OLLAMA_MODEL"
          curl --fail --silent --show-error http://127.0.0.1:11434/api/tags             | python -c 'import json,sys; p=json.load(sys.stdin); assert any(m.get("name","").startswith("smollm2:135m") for m in p.get("models",[]))'

      - name: Execute real gateway to Ollama E2E
        run: python scripts/e2e_ollama_dev.py

      - name: Validate sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_FILE"
          python - "$EVIDENCE_FILE" "$EXPECTED_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          evidence = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_sha = sys.argv[2]
          assert evidence["expected_sha"] == expected_sha, "E2E_SHA_MISMATCH"
          assert evidence["result"] == "E2E_PASSED", "E2E_NOT_PASSED"
          assert evidence["ollama_tags_readback"] is True, "OLLAMA_READBACK_MISSING"
          assert evidence["negative_auth_status"] == 401, "NEGATIVE_AUTH_NOT_PROVED"
          assert evidence["positive_status"] == 200, "POSITIVE_FLOW_NOT_PROVED"
          assert evidence["response_content_sha256"], "RESPONSE_HASH_MISSING"
          assert evidence["production_touched"] is False, "PRODUCTION_TOUCHED"
          assert evidence["deploy_executed"] is False, "DEPLOY_EXECUTED"
          print("E2E_EVIDENCE_VALIDATED")
          PY

      - name: Upload sanitized E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-gateway-e2e-dev-${{ github.run_id }}
          path: artifacts/ollama-gateway-e2e-dev/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup Ollama container
        if: always()
        shell: bash
        run: docker rm -f ollama-e2e >/dev/null 2>&1 || true

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Ollama Gateway E2E DEV"
            echo "- Runtime: GitHub-hosted hermetic"
            echo "- Ollama: $OLLAMA_IMAGE"
            echo "- Modelo: $OLLAMA_MODEL"
            echo "- SHA: $EXPECTED_SHA"
            echo "- Correlation ID: $CORRELATION_ID"
            echo "- Produção tocada: não"
            echo "- Deploy executado: não"
          } >> "$GITHUB_STEP_SUMMARY"
